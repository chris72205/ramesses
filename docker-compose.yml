# Local development datastores. Host ports are shifted (5433 / 6380) so they do not
# collide with a Postgres.app or local Redis already listening on the defaults.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ramesses
      POSTGRES_PASSWORD: ramesses
      POSTGRES_DB: ramesses
    ports:
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ramesses']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - '${REDIS_HOST_PORT:-6380}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
